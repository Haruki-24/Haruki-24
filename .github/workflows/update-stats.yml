name: Update README cards

on:
  schedule:
    - cron: "0 0 * * *" 
  workflow_dispatch: # Ejecucion manual

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      # 1. Tarjeta de Estadísticas
      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=Haruki-24&show_icons=true&theme=tokyonight&hide_border=true&count_private=true&include_all_commits=true&layout=compact
          path: profile/stats.svg
          token: ${{ secrets.STATS_TOKEN }}

      # 2. Tarjeta de Lenguajes
      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=Haruki-24&layout=compact&theme=tokyonight&hide_border=true&count_private=true&hide=jupyter%20notebook
          path: profile/top-langs.svg
          token: ${{ secrets.STATS_TOKEN }}

      # 3. Tarjeta de Racha (Streak)
      - name: Download Streak Stats
        run: |
          curl -s -o profile/streak.svg "https://streak-stats.demolab.com?user=Haruki-24&theme=tokyonight&hide_border=true&background=1A1B27"

      # 4. Actualizacion
      - name: Commit changes
        uses: EndBug/add-and-commit@v9
        with:
          author_name: github-actions[bot]
          author_email: github-actions[bot]@users.noreply.github.com
          message: "Update GitHub Stats SVGs"
          add: "profile/*.svg"
